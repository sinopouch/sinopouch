# ============================================================
# SinoPouch 网站后台配置
# 登录后台后，你可以修改：联系方式、产品分类、网站文案
# ============================================================

# 后端：使用 GitHub 存储内容，修改后自动重新发布网站
# 登录走 Cloudflare Worker 的 OAuth 中转（base_url），不用 Netlify
backend:
  name: github
  repo: sinopouch/sinopouch
  branch: main
  base_url: https://sinopouch-auth.pollyluo1.workers.dev
  auth_endpoint: /auth
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"

site_url: https://sinopouch.com
site_name: SinoPouch Content Manager

ui:
  labels:
    collections: "内容管理"

# 上传的图片存放位置
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ----------------------------------------------------------
  # 1. 联系方式
  # ----------------------------------------------------------
  - name: "site"
    label: "联系方式"
    description: "修改邮箱、WhatsApp、地址。改完点右上角 Publish 发布。"
    editor:
      preview: false
    files:
      - name: "contact"
        label: "联系信息"
        file: "data/site.json"
        fields:
          - { label: "公司名称", name: "company", widget: "string" }
          - { label: "邮箱", name: "email", widget: "string" }
          - { label: "WhatsApp 显示号码", name: "whatsapp", widget: "string", hint: "客户看到的，如 +86 138 0000 0000" }
          - { label: "WhatsApp 链接号码", name: "whatsapp_number", widget: "string", hint: "纯数字带国家码，如 8613800000000（不要 + 和空格）" }
          - { label: "地址第一行", name: "address_line1", widget: "string" }
          - { label: "地址第二行", name: "address_line2", widget: "string" }
          - { label: "工作时间", name: "hours", widget: "string" }
          - { label: "页脚简介", name: "footer_tagline", widget: "text" }

  # ----------------------------------------------------------
  # 2. 产品分类（图片 + 分类页海报 + 多款式图库）
  # ----------------------------------------------------------
  - name: "products"
    label: "产品分类"
    description: "编辑 7 个产品。产品图片显示在卡片和分类页；分类页可再传一张顶部海报和多种款式图。"
    editor:
      preview: false
    files:
      - name: "list"
        label: "全部产品"
        file: "data/products.json"
        fields:
          - label: "产品列表"
            name: "products"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "产品名称", name: "name", widget: "string" }
              - { label: "角标文字", name: "tag", widget: "string", required: false, hint: "如 BEST SELLER，留空则不显示" }
              - { label: "角标颜色", name: "tag_style", widget: "select", options: ["green", "amber"], default: "green" }
              - { label: "图标（无图时显示）", name: "icon", widget: "select", options: ["coffee", "mylar", "pet", "bread", "spout", "shaped", "standup"], default: "standup" }
              - { label: "产品图片", name: "image", widget: "image", required: false, hint: "显示在产品卡片上。建议横图 1200×800。" }
              - { label: "产品描述", name: "description", widget: "text" }
              - { label: "应用场景", name: "applications", widget: "string" }
              - { label: "可选配置", name: "options", widget: "string" }
              - { label: "详情页面", name: "page", widget: "select", options: ["coffee-bags.html", "mylar-bags.html", "pet-food-bags.html", "bread-bags.html", "spout-pouches.html", "special-shaped-bags.html", "stand-up-pouches.html", "contact.html"], default: "contact.html" }
              - { label: "分类页顶部海报", name: "banner_image", widget: "image", required: false, hint: "该分类页最上方的横幅海报。建议横图 1600×600。留空则用纯色背景。" }
              - label: "该分类的款式图片（可增删）"
                name: "gallery"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                hint: "每个款式会显示成一张产品卡片（图+名称+简介），客户点击卡片进入详情。"
                fields:
                  - { label: "款式主图", name: "image", widget: "image", required: false, hint: "卡片封面，也是详情第一张大图。建议方图或竖图，800×800 左右" }
                  - { label: "款式名称", name: "title", widget: "string", required: false, hint: "如 Matte Black / Kraft Window" }
                  - { label: "一句话简介", name: "desc", widget: "text", required: false, hint: "显示在卡片标题下方，可写 2-3 行介绍" }
                  - label: "详情图片（连同主图最多5张）"
                    name: "detail_images"
                    widget: "list"
                    required: false
                    max: 4
                    hint: "详情页左侧大图下方可切换的小图。加上方款式主图，一共最多显示 5 张，所以这里最多传 4 张。"
                    field: { label: "详情图", name: "image", widget: "image", required: false }
                  - label: "下方详细描述（可插图/表格/文字）"
                    name: "content"
                    widget: "markdown"
                    required: false
                    toolbar_buttons: ["bold", "italic", "heading", "link", "image", "table", "list-ul", "list-ol", "quote", "code"]
                    hint: "详情页标题和参数下方的介绍区。工具栏可插入图片、表格、文字，客户能看到。"

  # ----------------------------------------------------------
  # 3. 首页内容（Hero 海报文案 + 产品区 + 工厂区）
  # ----------------------------------------------------------
  - name: "home"
    label: "首页内容"
    description: "首页海报、文案、工厂图。改完点右上角 Publish 发布。"
    editor:
      preview: false
    files:
      - name: "texts"
        label: "首页全部内容"
        file: "data/content.json"
        fields:
          - label: "── 首页顶部海报 ──"
            name: "hero_banner"
            widget: "image"
            required: false
            hint: "第1条：首页顶部会上传一张海边海报，在这里替换。建议宽幅横图 1920×700。"
          - { label: "顶部小标题", name: "hero_eyebrow", widget: "string" }
          - { label: "大标题第一段", name: "home_hero_before", widget: "string" }
          - { label: "大标题高亮词", name: "home_hero_accent", widget: "string", hint: "用琥珀色突出" }
          - { label: "大标题第三段", name: "home_hero_after", widget: "string" }
          - { label: "副标题", name: "home_hero_lead", widget: "text" }
          - { label: "按钮1文字", name: "hero_btn1", widget: "string" }
          - { label: "按钮2文字", name: "hero_btn2", widget: "string" }
          - { label: "右侧产品图（可选）", name: "hero_image", widget: "image", required: false, hint: "有海报时可留空" }

          - label: "── 产品展示区 ──"
            name: "home_products_eyebrow"
            widget: "string"
            hint: "第2条：以下标题/副标题可随时修改；产品图片和文案在左侧『产品分类』里改。"
          - { label: "产品区标题", name: "home_products_title", widget: "string" }
          - { label: "产品区副标题", name: "home_products_lead", widget: "text" }

          - label: "── 工厂展示区 ──"
            name: "home_factory_eyebrow"
            widget: "string"
            hint: "第3条：工厂三张图和文字都在这里修改。"
          - { label: "工厂区标题", name: "home_factory_title", widget: "string" }
          - { label: "工厂区副标题", name: "home_factory_lead", widget: "text" }
          - { label: "工厂图1说明", name: "factory_label_1", widget: "string" }
          - { label: "工厂图1", name: "factory_image_1", widget: "image", required: false }
          - { label: "工厂图2说明", name: "factory_label_2", widget: "string" }
          - { label: "工厂图2", name: "factory_image_2", widget: "image", required: false }
          - { label: "工厂图3说明", name: "factory_label_3", widget: "string" }
          - { label: "工厂图3", name: "factory_image_3", widget: "image", required: false }

  # ----------------------------------------------------------
  # 4. 内页内容（Products / OEM / Certifications / Contact）
  # ----------------------------------------------------------
  - name: "pages"
    label: "内页内容"
    description: "各内页顶部海报和文字。改完点右上角 Publish 发布。"
    editor:
      preview: false
    files:
      - name: "pages"
        label: "内页海报与文字"
        file: "data/pages.json"
        fields:
          - label: "── Products 产品总览页 ──"
            name: "products_banner"
            widget: "image"
            required: false
            hint: "第4条：产品总览页顶部海报。"
          - { label: "标题", name: "products_hero_title", widget: "string" }
          - { label: "副标题", name: "products_hero_lead", widget: "text" }

          - label: "── OEM / Custom 定制页 ──"
            name: "oem_banner"
            widget: "image"
            required: false
            hint: "第5条：定制页最上方海报。"
          - { label: "标题", name: "oem_hero_title", widget: "string" }
          - { label: "副标题", name: "oem_hero_lead", widget: "text" }
          - label: "定制流程步骤（可增删）"
            name: "oem_steps"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "步骤标题", name: "title", widget: "string" }
              - { label: "步骤说明", name: "text", widget: "text" }

          - label: "── Certifications 认证页 ──"
            name: "cert_hero_title"
            widget: "string"
            hint: "第6条：此页顶部不用海报，改成下方左图右文的证书列表。"
          - { label: "副标题", name: "cert_hero_lead", widget: "text" }
          - label: "证书列表（左图右文，可增删）"
            name: "certificates"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "证书图片", name: "image", widget: "image", required: false, hint: "如 BRC 蓝色标志、BSCI 圆形标志" }
              - { label: "证书标题", name: "title", widget: "string" }
              - { label: "证书说明", name: "text", widget: "text" }

          - label: "── Contact 联系页 ──"
            name: "contact_banner"
            widget: "image"
            required: false
            hint: "第7条：联系页顶部海报图片。"
          - { label: "标题", name: "contact_hero_title", widget: "string" }
          - { label: "副标题", name: "contact_hero_lead", widget: "text" }

          - { label: "行动区标题", name: "cta_title", widget: "string" }
          - { label: "行动区文字", name: "cta_text", widget: "text" }
