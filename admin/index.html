<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SinoPouch 内容管理后台</title>
  <style>
    html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Arial,sans-serif;background:#21A179}
    #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:1}
    #loading .logo{font-size:34px;font-weight:800;letter-spacing:-1px}
    #loading .logo span{color:#F2A93B}
    #loading p{margin-top:14px;color:#cfe3db;font-size:14px}
    #loading .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#F2A93B;border-radius:50%;animation:s 1s linear infinite;margin-bottom:20px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
    <div class="logo">Sino<span>Pouch</span></div>
    <p>后台加载中，请稍候…</p>
  </div>
  <!-- Decap CMS 编辑器脚本（加载后自动隐藏上面的 loading） -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.3/dist/decap-cms.js"></script>
  <script>
    // 隐藏加载动画
    window.setTimeout(function () {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }, 3500);
  </script>
</body>
</html>
